# .gitleaks.toml
# Gitleaks configuration for secret scanning
# For more information, see https://github.com/gitleaks/gitleaks
#
# Division of secret-scanning labor:
# - gitleaks (CI, .github/workflows/gitleaks.yml): full-history scan using the
#   default rule set (extended below) plus the repo-specific overrides.
# - secretlint (local gate, scripts/secretlint_gate.sh): working-tree scan with
#   preset-recommend. The allowlist paths below mirror .secretlintignore so
#   CI and local verdicts stay aligned instead of diverging in both directions.

[extend]
useDefault = true

[allowlist]
description = "Global allowlist (mirrors .secretlintignore so history scans and working-tree scans agree)"
paths = [
    '''Cargo\.lock''',
    '''package-lock\.json''',
    '''go\.sum''',
    '''(?:^|/)node_modules/''',
    '''(?:^|/)target/''',
    '''(?:^|/)dist/''',
    '''(?:^|/)tests/fixtures/''',
    '''.*\.snap$''',
    '''llms-full\.txt$''',
    '''llms\.txt$''',
    '''.*\.(png|svg|ico)$''',
    '''\.agents/skills/.*/(tests|references)/''',
    '''(?:^|/)[^/]*-workspace/''',
]

[[rules]]
description = "Generic API Key"
id = "generic-api-key"
regex = '''(?i)(api_key|apikey|secret|token|auth|key|password)[[:space:]]*[:=][[:space:]]*['"][a-zA-Z0-9_\-]{16,}['"]'''
entropy = 3.5
keywords = ["api_key", "apikey", "secret", "token", "auth", "key", "password"]

[[rules]]
description = "GitHub Personal Access Token"
id = "github-pat"
regex = '''ghp_[a-zA-Z0-9]{36}'''
keywords = ["ghp_"]

[[rules]]
description = "GitHub OAuth Access Token"
id = "github-oauth"
regex = '''gho_[a-zA-Z0-9]{36}'''
keywords = ["gho_"]

[[rules]]
description = "GitHub App Token"
id = "github-app-token"
regex = '''(ghu|ghs)_[a-zA-Z0-9]{36}'''
keywords = ["ghu_", "ghs_"]

[[rules]]
description = "GitHub Refresh Token"
id = "github-refresh-token"
regex = '''ghr_[a-zA-Z0-9]{76}'''
keywords = ["ghr_"]
