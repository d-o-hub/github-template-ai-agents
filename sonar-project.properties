# SonarCloud automatic analysis configuration.
#
# The Sonar Quality Gate requires new_security_rating >= A on main. The three
# suppressions below are narrow (one rule, one file) and cover findings that are
# intentional by design; every other security finding must be fixed in code.
sonar.issue.ignore.multicriteria=s1,s2,s3

# secretlint_gate.sh: npx on-demand install is the gate's own bootstrap
# mechanism; lifecycle scripts are disabled via --ignore-scripts at the call site.
sonar.issue.ignore.multicriteria.s1.ruleKey=shell:S6505
sonar.issue.ignore.multicriteria.s1.resourceKey=**/secretlint_gate.sh

# test-boundaries.sh: clear-text URLs are intentional fixtures asserting that
# http:// commands are categorized DANGEROUS by the command security layer.
sonar.issue.ignore.multicriteria.s2.ruleKey=shell:S5332
sonar.issue.ignore.multicriteria.s2.resourceKey=**/test-boundaries.sh

# setup-repo composite action: npm ci keeps lifecycle scripts enabled on
# purpose so consumer repos can run native-module postinstalls.
sonar.issue.ignore.multicriteria.s3.ruleKey=githubactions:S6505
sonar.issue.ignore.multicriteria.s3.resourceKey=**/setup-repo/action.yml
