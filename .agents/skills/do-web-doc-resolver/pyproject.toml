[project]
name = "do-web-doc-resolver"
version = "0.3.9"
description = "Resolve queries or URLs into compact, LLM-ready markdown using a low-cost cascade"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "d-oit"}
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup :: Markdown",
]
keywords = ["llm", "markdown", "web-scraping", "documentation", "agent", "skill"]
dependencies = [
    "ddgs>=9.0.0",
    "httpx[http2]>=0.28.1",
    "trafilatura>=1.10.0",
    "readability-lxml>=0.8.1",
    "diskcache>=5.6.0",
]

[project.optional-dependencies]
providers = [
    "exa-py>=1.0.0",
    "tavily-python>=0.3.0",
    "firecrawl-py>=0.0.5",
]
ml = [
    "sentence-transformers>=5.5.1",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
    "playwright>=1.40.0",
]
db = [
    "sqlite-vec>=0.1.0",
    "pysqlite3-binary>=0.5.0",
]
all = [
    "do-web-doc-resolver[providers,ml,db]",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "flake8>=7.3.0",
    "mypy>=1.5.0",
    "types-requests>=2.31.0",
    "requests>=2.31.0",
    "pip-audit>=2.7.0",
]

[project.scripts]
do-wdr = "scripts.cli:main"
do-web-doc-resolver = "scripts.cli:main"

[project.urls]
Homepage = "https://github.com/d-oit/do-web-doc-resolver"
Documentation = "https://github.com/d-oit/do-web-doc-resolver#readme"
Repository = "https://github.com/d-oit/do-web-doc-resolver"
Issues = "https://github.com/d-oit/do-web-doc-resolver/issues"
Changelog = "https://github.com/d-oit/do-web-doc-resolver/releases"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts*"]

[tool.black]
line-length = 100
target-version = ["py311", "py312", "py313"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | __pycache__
    | web/node_modules
    | \.agents/skills
    | \.blackbox/skills
    | \.claude/skills
    | \.cache
)/
'''

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".agents/skills/", ".blackbox/skills/", ".claude/skills/", ".cache/"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "UP017",  # datetime.UTC alias (requires Python 3.11+; project supports 3.10)
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = ".(agents|blackbox|claude|opencode)/skills/"

[[tool.mypy.overrides]]
module = [
    "diskcache.*",
    "sentence_transformers.*",
    "trafilatura.*",
    "readability.*",
    "sqlite_vec.*",
    "pysqlite3.*",
    "exa.*",
    "tavily.*",
    "firecrawl.*",
    "ddgs.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "unit: marks unit tests that run fast without external services",
    "live: marks tests as live integration tests requiring real API keys (deselect with '-m not live')",
    "integration: marks integration tests that may require external services or built binaries",
    "benchmark: enables pytest-benchmark style tests without plugin",
]
