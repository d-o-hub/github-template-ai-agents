---
name: CI

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
  pull_request:
    branches:
      - main
      - develop
  # Bot-authored PRs (GITHUB_TOKEN) do not trigger `pull_request` runs, so their
  # branches are otherwise unvalidated. `gh workflow run ci.yml --ref <branch>`
  # gives them a real test job before merge.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      agents: ${{ steps.filter.outputs.agents }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: filter
        with:
          filters: |
            code:
              - '**/*.py'
              - '**/*.ts'
              - '**/*.tsx'
              - '**/*.js'
              - '**/*.jsx'
              - '**/*.sh'
              - '**/*.yml'
              - '**/*.yaml'
              - '**/*.toml'
              - 'pyproject.toml'
              - 'requirements.txt'
              - 'package.json'
              - 'VERSION'
            agents:
              - 'AGENTS.md'
              - 'CLAUDE.md'
              - 'GEMINI.md'
              - 'QWEN.md'
              - '.agents/**'
              - 'agents-docs/**'
              - '.claude/**'
              - '.qwen/**'
            workflows:
              - '.github/workflows/**'

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes]
    if: |
      always() &&
      (needs.changes.outputs.code == 'true' ||
       needs.changes.outputs.agents == 'true' ||
       needs.changes.outputs.workflows == 'true')
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup skills
        run: ./scripts/setup-skills.sh

      - name: Setup Node.js (if package.json exists)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
        if: hashFiles('package.json') != ''

      - name: Setup Rust (if Cargo.toml exists)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # stable
        with:
          components: rustfmt, clippy
        if: hashFiles('Cargo.toml') != ''

      - name: Setup Python (if requirements.txt or pyproject.toml exists)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'
        if: >-
          hashFiles('requirements.txt') != '' ||
          hashFiles('pyproject.toml') != '' ||
          hashFiles('.agents/skills/*/requirements.txt') != '' ||
          hashFiles('.agents/skills/*/pyproject.toml') != ''

      - name: Setup Go (if go.mod exists)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: '1.21'
        if: hashFiles('go.mod') != ''

      - name: Install dependencies (Node)
        run: npm ci
        if: hashFiles('package.json') != ''

      - name: Install dependencies (Python)
        run: |
          pip install ruff black pytest
        if: >-
          hashFiles('requirements.txt') != '' ||
          hashFiles('pyproject.toml') != '' ||
          hashFiles('.agents/skills/*/requirements.txt') != '' ||
          hashFiles('.agents/skills/*/pyproject.toml') != ''

      - name: Install shellcheck and bats
        run: |
          for i in {1..3}; do sudo apt-get update && break || sleep 5; done
          sudo apt-get install -y shellcheck bats

      - name: Validate agent config schemas
        run: |
          set -euo pipefail
          if ! command -v python3 &>/dev/null; then
            echo "No python3 available, skipping" >&2
            exit 0
          fi
          for config in opencode.json; do
            if [ ! -f "$config" ]; then
              continue
            fi
            SCHEMA_URL=$(python3 -c "
          import json
          with open('$config') as f:
              data = json.load(f)
          print(data.get('\$schema', ''))
          " 2>/dev/null || true)
            if [ -z "$SCHEMA_URL" ]; then
              echo "No \$schema in $config, skipping"
              continue
            fi
            SCHEMA_FILE="/tmp/schema-$(basename "$config")"
            if curl -sfL "$SCHEMA_URL" -o "$SCHEMA_FILE" 2>/dev/null; then
              if python3 -c "
          import json, sys
          try:
              import jsonschema
              with open('$config') as f:
                  data = json.load(f)
              with open('$SCHEMA_FILE') as f:
                  schema = json.load(f)
              jsonschema.validate(data, schema)
              print('OK: $config')
          except ImportError:
              with open('$config') as f:
                  data = json.load(f)
              assert isinstance(data, dict), 'Root must be object'
              print('OK (basic): $config')
          except Exception as e:
              print(f'FAIL: $config: {e}', file=sys.stderr)
              sys.exit(1)
          " 2>/dev/null; then
                echo "Validated $config"
              else
                echo "WARNING: Could not validate $config" >&2
              fi
            else
              echo "WARNING: Could not fetch schema for $config from $SCHEMA_URL" >&2
            fi
          done

      - name: Run quality gate
        run: |
          SKIP_GLOBAL_HOOKS_CHECK=true ./scripts/quality_gate.sh

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: [changes, quality-gate]
    if: |
      always() &&
      needs.changes.outputs.code == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup skills
        run: ./scripts/setup-skills.sh

      - name: Setup Node.js (if package.json exists)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
        if: hashFiles('package.json') != ''

      - name: Setup Rust (if Cargo.toml exists)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # stable
        if: hashFiles('Cargo.toml') != ''

      # Unconditional in the test job: the root suite contains pure-Python
      # checks (tests/test_workflow_versions.py, ci-status tristate, path
      # validation) and corpus BATS tests whose heredocs `import yaml`. Both
      # were silently skipped whenever no root requirements.txt existed, so a
      # green run meant "never ran". The suite's own assumptions must not be
      # gated on an optional manifest. See plans/adr-041-ci-test-job-self-contained.md.
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'

      - name: Setup Go (if go.mod exists)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: '1.21'
        if: hashFiles('go.mod') != ''

      - name: Install dependencies (Node)
        run: npm ci
        if: hashFiles('package.json') != ''

      - name: Install dependencies (Python root)
        run: pip install -r requirements.txt
        if: hashFiles('requirements.txt') != ''

      - name: Install dependencies (Python skills)
        run: |
          for dir in .agents/skills/*/; do
            if [ -f "$dir/requirements.txt" ]; then
              echo "Installing dependencies for $dir..."
              pip install -r "$dir/requirements.txt"
            fi
          done
        if: hashFiles('.agents/skills/*/requirements.txt') != ''

      - name: Run tests (Node)
        run: npm test
        if: hashFiles('package.json') != ''

      - name: Run tests (Rust)
        run: cargo test --lib
        if: hashFiles('Cargo.toml') != ''

      # Installed last on purpose: the root suite and the corpus BATS tests both
      # need pytest + PyYAML, and no manifest in this repo guarantees them. A
      # missing PyYAML made every `import yaml` BATS test fail while the run
      # still looked like a code failure. See plans/adr-041-ci-test-job-self-contained.md.
      - name: Install test dependencies (Python root)
        run: pip install pytest pyyaml

      - name: Run tests (Python root)
        run: pytest tests/ -v

      - name: Run tests (Python skills)
        run: |
          for dir in .agents/skills/*/; do
            if [ -f "$dir/pyproject.toml" ]; then
              echo "Running tests for $dir..."
              (cd "$dir" && python -m pytest tests/ -v -m "not live")
            fi
          done
        if: hashFiles('.agents/skills/*/pyproject.toml') != ''

      - name: Run tests (Go)
        run: go test ./...
        if: hashFiles('go.mod') != ''

      - name: Setup BATS
        run: |
          for i in {1..3}; do sudo apt-get update && break || sleep 5; done
          sudo apt-get install -y bats

      - name: Run BATS tests
        run: |
          if [ -d "tests" ] && [ -n "$(find tests -name '*.bats' \
            -print -quit 2>/dev/null)" ]
          then
            echo "Running BATS tests..."
            bats tests/*.bats
          else
            echo "No BATS tests found"
          fi

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [quality-gate, test]
    if: always()
    permissions:
      contents: write
      pull-requests: write
    env:
      # Allowlist (never denylist) of job ids whose skip is tolerated. Empty by
      # default: a required job must actually run to be certified green. GitHub
      # reports an `if:`-skipped job as "Success" and it does not block a merge
      # even as a required check, so tolerating every skip is fail-open.
      # Set the repository variable CI_STATUS_ALLOWED_SKIPS (e.g. "test") only
      # when a skip is deliberate for this repository.
      CI_STATUS_ALLOWED_SKIPS: ${{ vars.CI_STATUS_ALLOWED_SKIPS }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'

      - name: Update CI status artifacts
        # Runs on every main push, including all-skipped ones: the artifact must
        # record that nothing validated ("unknown") rather than keep a stale green.
        # The fail-closed tri-state lives in scripts/update-ci-status.py.
        if: github.ref == 'refs/heads/main'
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/update-ci-status.py

      - name: Upload CI status as artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v4
        with:
          name: ci-status
          path: |
            .github/ci-status/ci-status.json
            .github/ci-status/ci-summary.md

      - name: Persist CI data to main
        if: github.ref == 'refs/heads/main' && always()
        run: ./scripts/persist-ci-status.sh
        env:
          GH_TOKEN: ${{ github.token }}

      # Deliberately last: the artifact is written and persisted even when this
      # gate fails, so a red run is always recorded. Explicit expected-value
      # assertion per dependency (success, or an allowlisted skip) instead of a
      # denylist of bad results — `!failure()` and `failure|cancelled` are both
      # false-green when a dependency was skipped.
      - name: Check all required jobs passed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/update-ci-status.py --check
