---
name: Monthly DORA Report
on:
  schedule:
    - cron: '0 0 1 * *'  # First of every month
  workflow_dispatch:

jobs:
  dora-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'

      - name: Fetch GitHub data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "/repos/${{ github.repository }}/releases" --paginate \
            --jq '[.[] | {tag: .tag_name, published: .published_at}]' \
            > /tmp/releases.json || echo '[]' > /tmp/releases.json
          gh api "/repos/${{ github.repository }}/pulls?state=closed&base=main" --paginate \
            --jq '[.[] | select(.merged_at != null) | {pr: .number, created: .created_at, merged: .merged_at}]' \
            > /tmp/prs.json || echo '[]' > /tmp/prs.json

      - name: Generate DORA Report
        run: |
          mkdir -p agents-docs/dora-reports
          cat .agents/metrics/metrics-*.jsonl > .agents/metrics.jsonl 2>/dev/null || true
          touch .agents/metrics.jsonl dora-metrics.jsonl
          REPORT_PATH="agents-docs/dora-reports/$(date -u +%Y-%m).md"
          if [ -f .agents/skills/dora-report/scripts/generate_report.py ]; then
            python3 .agents/skills/dora-report/scripts/generate_report.py
          else
            {
              echo "# DORA Report"
              echo "Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo ""
              echo "Agent metrics entries: $(wc -l < .agents/metrics.jsonl)"
              echo ""
              echo "Releases in period: $(jq 'length' /tmp/releases.json)"
              echo "Merged PRs in period: $(jq 'length' /tmp/prs.json)"
            } > "$REPORT_PATH"
          fi
          ls -la agents-docs/dora-reports/

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          commit-message: "docs(dora): update monthly DORA report [skip ci]"
          title: "docs(dora): monthly DORA performance report update"
          body: "Automated monthly DORA report generation."
          branch: "automation/dora-report"
          base: main
          labels: |
            agentic
            documentation
